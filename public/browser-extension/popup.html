<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>OMNIA AI Local Bridge</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }
    h2 { font-size: 15px; margin: 0 0 8px 0; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
    p { font-size: 12px; color: #94a3b8; line-height: 1.4; margin: 0 0 12px 0; }
    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      background: #1e293b;
      color: #22c55e;
      border: 1px solid #334155;
      margin-bottom: 12px;
    }
    .rule {
      padding: 8px;
      background: #1e293b;
      border-radius: 6px;
      font-size: 11px;
      color: #cbd5e1;
      margin-bottom: 6px;
    }
    .link {
      display: block;
      text-align: center;
      margin-top: 12px;
      font-size: 12px;
      color: #38bdf8;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <h2>OMNIA AI Bridge</h2>
  <div class="badge">Zero-Cookie Local Mode Active</div>
  <p>Enables OMNIA AI (http://localhost:3000) to communicate with your open provider tabs directly in the browser.</p>
  <div class="rule">✓ No cookies or passwords collected</div>
  <div class="rule">✓ Local communication only</div>
  <div class="rule">✓ ChatGPT, Gemini, Claude, and Grok isolation</div>
  <a class="link" href="http://localhost:3000" target="_blank">Open OMNIA AI Workspace</a>
</body>
</html>
